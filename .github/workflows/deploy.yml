name: Vérification et déploiement Piloz Admin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: piloz-admin-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Vérifier la configuration publique Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Le repository secret VITE_SUPABASE_URL est absent."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Le repository secret VITE_SUPABASE_ANON_KEY est absent."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL doit être une URL Supabase HTTPS."; exit 1 ;;
          esac
          if [ ${#VITE_SUPABASE_ANON_KEY} -le 30 ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY est invalide."
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Vérifier les protections de publication
        run: |
          test "$(cat public/CNAME)" = "admin.piloz.fr"
          ! grep -R "SUPABASE_SERVICE_ROLE_KEY" src public dist
          grep -q "Disallow: /" public/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Déployer après bootstrap SA validé
        id: deployment
        uses: actions/deploy-pages@v4
